<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lista de la Compra</title>
<meta name="description" content="Lista de la compra offline organizada por secciones del supermercado">
<meta name="theme-color" content="#16a34a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Compra">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <h1>🛒 Lista de la compra</h1>
    <button id="menuBtn" class="icon-btn" title="Más opciones" aria-haspopup="true" aria-expanded="false">⋮</button>
    <nav id="menuPanel" class="menu-panel hidden">
      <button id="manageCatalogBtn">🏷️ Productos habituales</button>
      <button id="saveTemplateBtn">💾 Guardar como lista recurrente</button>
      <button id="loadTemplateBtn">📋 Cargar lista recurrente</button>
      <button id="clearCheckedBtn">🧹 Quitar marcados</button>
      <button id="clearAllBtn">🗑️ Vaciar lista</button>
    </nav>
  </header>

  <main>
    <div id="totalBar" class="total-bar hidden">Total estimado: <strong id="totalAmount">0,00 €</strong></div>
    <div id="categoriesContainer"></div>
  </main>

  <div id="templatesModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Listas recurrentes</h2>
        <button id="closeTemplatesBtn" class="icon-btn" title="Cerrar">✖</button>
      </div>
      <div id="templatesList" class="templates-list"></div>
    </div>
  </div>

  <div id="catalogModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Productos habituales</h2>
        <button id="closeCatalogBtn" class="icon-btn" title="Cerrar">✖</button>
      </div>
      <form id="catalogForm" class="catalog-form" autocomplete="off">
        <input id="catalogNameInput" type="text" placeholder="Nombre (ej. Pollo asado)" required>
        <input id="catalogPriceInput" type="number" step="0.01" min="0" placeholder="Precio €">
        <button type="submit" class="icon-btn primary" title="Añadir">➕</button>
      </form>
      <div class="catalog-import-row">
        <button type="button" id="importCatalogBtn">📥 Importar desde CSV/Excel</button>
        <input id="importCatalogFile" type="file" accept=".csv,text/csv" class="hidden" aria-label="Importar archivo CSV">
      </div>
      <div id="catalogList" class="catalog-list"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
